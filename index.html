  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      background: #000;
    }


    /* ==============================
       VIDEO CONTAINER
       ============================== */

    .video-container {

      position: relative;

      width: 100%;
      max-width: 700px;

      margin: 0 auto;

      background: #000;

      overflow: hidden;
    }


    /* ==============================
       VIDEO
       ============================== */

    video {

      display: block;

      width: 100%;
      height: auto;

      background: #000;

      transition:
        filter 0.4s ease;
    }


    /* ==============================
       BLUR
       ============================== */

    .video-container.locked video {

      filter:
        blur(7px)
        brightness(0.40);
    }


    /* ==============================
       OVERLAY
       ============================== */

    .video-overlay {

      position: absolute;

      inset: 0;

      display: none;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      gap: 12px;

      padding: 20px;

      background:
        rgba(0, 0, 0, 0.30);

      z-index: 10;
    }


    .video-container.locked .video-overlay {

      display: flex;
    }


    /* ==============================
       TEXT
       ============================== */

    .sponsor-text {

      color: #fff;

      font-size: 14px;

      text-align: center;

      max-width: 350px;

      line-height: 1.5;
    }


    /* ==============================
       BUTTON
       ============================== */

    #continueButton {

      padding: 15px 30px;

      border: none;

      border-radius: 10px;

      background: #2196f3;

      color: #fff;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.5);

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }


    #continueButton:hover {

      transform: scale(1.05);

      opacity: 0.95;
    }


    #continueButton:active {

      transform: scale(0.98);
    }

<body>


  <!-- ==============================
       VIDEO
       ============================== -->

  <div
    class="video-container"
    id="videoContainer"
  >

    <video
      id="videoPlayer"
      controls
      playsinline
      preload="metadata"
    >

      <source
        src="https://cdn2.videy.co/j0JIPDQb1.mp4"
        type="video/mp4"
      >

      Browser kamu tidak mendukung video HTML5.

    </video>


    <!-- ==============================
         OVERLAY
         ============================== -->

    <div
      class="video-overlay"
      id="videoOverlay"
    >

      <div class="sponsor-text">

        Video dijeda sementara.
        Klik tombol di bawah untuk membuka
        halaman iklan, lalu kembali ke halaman ini
        untuk melanjutkan video.

      </div>


      <button
        id="continueButton"
        type="button"
      >

        ▶ Buka iklan &amp; Lanjut Menonton

      </button>

    </div>

  </div>


  <script>


    /* ==============================
       ELEMENT
       ============================== */

    const video =
      document.getElementById("videoPlayer");

    const videoContainer =
      document.getElementById("videoContainer");

    const continueButton =
      document.getElementById("continueButton");


    /* ==============================
       DIRECT LINK
       TETAP SAMA
       ============================== */

    const directLink =
      "https://www.effectivecpmnetwork.com/jajsmmts?key=3379e30611a4277cdd49864562b580a3";


    /* ==============================
       PENGATURAN
       ============================== */

    /*
     * Interupsi pertama:
     * setelah video mencapai 20 detik.
     */

    const firstTrigger =
      20;


    /*
     * Interupsi kedua:
     * 60 detik setelah video dilanjutkan
     * setelah interupsi pertama.
     */

    const secondDelay =
      60;


    /* ==============================
       STATUS
       ============================== */

    let interruptionCount =
      0;

    let waitingForReturn =
      false;

    let sponsorOpened =
      false;

    let secondTimer =
      null;

    let resumeTimeout =
      null;


    /* ==============================
       INTERUPSI PERTAMA
       ============================== */

    video.addEventListener(
      "timeupdate",
      function () {

        /*
         * Hanya cek interupsi pertama.
         */

        if (
          interruptionCount !== 0
        ) {
          return;
        }


        /*
         * Jangan kunci jika sedang
         * menunggu user kembali.
         */

        if (
          waitingForReturn
        ) {
          return;
        }


        /*
         * Video mencapai 20 detik.
         */

        if (
          video.currentTime >= firstTrigger
        ) {

          lockVideo();

        }

      }
    );


    /* ==============================
       KUNCI VIDEO
       ============================== */

    function lockVideo() {

      /*
       * Jangan menjalankan dua kali.
       */

      if (
        waitingForReturn
      ) {
        return;
      }


      waitingForReturn =
        true;


      /*
       * Pause video.
       */

      video.pause();


      /*
       * Aktifkan blur + overlay.
       */

      videoContainer.classList.add(
        "locked"
      );

    }


    /* ==============================
       KLIK TOMBOL
       ============================== */

    continueButton.addEventListener(
      "click",
      function () {

        /*
         * Tandai bahwa direct link
         * sudah dibuka.
         */

        sponsorOpened =
          true;


        /*
         * Buka direct link.
         *
         * URL TIDAK DIUBAH.
         */

        window.open(
          directLink,
          "_blank",
          "noopener,noreferrer"
        );

      }
    );


    /* ==============================
       USER KEMBALI
       ============================== */

    document.addEventListener(
      "visibilitychange",
      function () {

        if (
          document.visibilityState !== "visible"
        ) {
          return;
        }


        if (
          !sponsorOpened ||
          !waitingForReturn
        ) {
          return;
        }


        /*
         * Hindari resume berkali-kali
         * akibat beberapa event browser.
         */

        if (
          resumeTimeout
        ) {
          clearTimeout(
            resumeTimeout
          );
        }


        resumeTimeout =
          setTimeout(
            function () {

              resumeVideo();

            },
            300
          );

      }
    );


    /* ==============================
       PAGESHOW
       ============================== */

    window.addEventListener(
      "pageshow",
      function () {

        /*
         * Hanya gunakan pageshow jika
         * benar-benar sedang menunggu
         * user kembali.
         */

        if (
          !sponsorOpened ||
          !waitingForReturn
        ) {
          return;
        }


        if (
          resumeTimeout
        ) {
          clearTimeout(
            resumeTimeout
          );
        }


        resumeTimeout =
          setTimeout(
            function () {

              resumeVideo();

            },
            300
          );

      }
    );


    /* ==============================
       RESUME VIDEO
       ============================== */

    function resumeVideo() {

      /*
       * Pastikan masih menunggu.
       */

      if (
        !waitingForReturn
      ) {
        return;
      }


      /*
       * Hilangkan blur.
       */

      videoContainer.classList.remove(
        "locked"
      );


      /*
       * Selesai menunggu.
       */

      waitingForReturn =
        false;

      sponsorOpened =
        false;


      /*
       * Tambahkan jumlah interupsi.
       */

      interruptionCount++;


      /* ==============================
         SETELAH INTERUPSI PERTAMA
         ============================== */

      if (
        interruptionCount === 1
      ) {

        /*
         * Hapus timer sebelumnya.
         */

        if (
          secondTimer
        ) {

          clearTimeout(
            secondTimer
          );

        }


        /*
         * Mulai timer 60 detik.
         *
         * Timer ini berjalan setelah
         * video kembali dilanjutkan.
         */

        secondTimer =
          setTimeout(
            function () {

              /*
               * Pastikan ini masih merupakan
               * interupsi kedua.
               */

              if (
                interruptionCount !== 1
              ) {
                return;
              }


              /*
               * Pastikan video sedang berjalan.
               */

              if (
                video.paused
              ) {
                return;
              }


              /*
               * Tampilkan interupsi kedua.
               */

              lockVideo();

            },
            secondDelay * 1000
          );

      }


      /*
       * ============================
       * SETELAH INTERUPSI KEDUA
       * ============================
       *
       * interruptionCount === 2
       *
       * Tidak membuat timer baru.
       *
       * Jadi setelah user kembali
       * dari interupsi kedua, video
       * berjalan sampai selesai.
       */


      /* ==============================
         LANJUTKAN VIDEO
         ============================== */

      const playPromise =
        video.play();


      if (
        playPromise !== undefined
      ) {

        playPromise.catch(
          function () {

            /*
             * Browser tertentu dapat
             * menolak autoplay setelah
             * perpindahan tab.
             *
             * User masih bisa menekan
             * tombol Play pada kontrol video.
             */

          }
        );

      }

    }


    /* ==============================
       VIDEO SELESAI
       ============================== */

    video.addEventListener(
      "ended",
      function () {

        /*
         * Bersihkan timer jika video
         * sudah selesai.
         */

        if (
          secondTimer
        ) {

          clearTimeout(
            secondTimer
          );

          secondTimer =
            null;

        }

      }
    );


  </script>
